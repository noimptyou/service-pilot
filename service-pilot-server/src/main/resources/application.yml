spring:
  application:
    name: service-pilot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/service_pilot}
    username: ${DB_USERNAME:service_pilot}
    password: ${DB_PASSWORD:service_pilot_dev}
  flyway:
    enabled: true
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    vectorstore:
      type: none
      pgvector:
        initialize-schema: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.servicepilot: INFO
